name: Question
description: Ask how something works, or whether the project fits what you need
labels: [question]
body:
  - type: textarea
    id: question
    attributes:
      label: Your question
    validations:
      required: true
  - type: textarea
    id: tried
    attributes:
      label: What have you tried so far?
      description: What you read or ran, and what happened. Leave it empty if you have not started yet.
