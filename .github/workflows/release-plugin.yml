name: Release plugin

# Attaches the FindWright plugin zip and its helper tarball to a release.
# The marketplace's archive source installs the zip; the zip's helper.json
# pins the tarball by SHA-256, and /findwright:setup installs only that file.
#
# Both are rebuilt from the release tag by tools/pack.mjs, which reads the
# files git stores, so every machine builds the same bytes. The job refuses a
# zip whose SHA-256 differs from the pin in the wrights marketplace
# (starfoxcom/wrights, its main branch), since that copy is the one every
# machine installs from. The same files then go to the `plugin` branch, which
# the plugin directory follows.
#
# When a run refuses, fix the pin in the wrights marketplace and run this again
# for the same release, never moving its tag:
#   gh workflow run release-plugin.yml -f tag=vX.Y.Z

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "A published release, such as v0.1.0"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-plugin
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  TAG: ${{ github.event.release.tag_name || inputs.tag }}
  MARKETPLACE_REPO: starfoxcom/wrights

jobs:
  release:
    name: Plugin zip and helper
    # By hand, only the default branch's copy of this workflow runs.
    if: github.event_name == 'release' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::'$TAG' is not a release tag such as v0.1.0"
            exit 1
          fi
          draft=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft) || {
            echo "::error::there is no release $TAG"
            exit 1
          }
          if [ "$draft" != false ]; then
            echo "::error::release $TAG is a draft: publish it first"
            exit 1
          fi

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6 (v6.1.0)
        with:
          ref: refs/tags/${{ env.TAG }}
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7 (v7.1.0)
        with:
          node-version: "lts/*"
          check-latest: true

      - name: Build the zip and the helper, and check them against the pins
        id: build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          zip="findwright-$version.zip"
          dir="$RUNNER_TEMP/helper"
          mkdir -p "$dir"
          market="$RUNNER_TEMP/marketplace.json"
          path="repos/$MARKETPLACE_REPO/contents/.claude-plugin/marketplace.json?ref=main"
          gh api -H "Accept: application/vnd.github.raw+json" "$path" > "$market"
          node tools/pack.mjs --zip "$zip" --ref HEAD
          node tools/pack.mjs --tgz "$dir" --ref HEAD
          unzip -p "$zip" helper.json > "$RUNNER_TEMP/helper.json"
          node - "$zip" "$version" "$market" "$MARKETPLACE_REPO" "$RUNNER_TEMP/helper.json" "$dir" <<'EOF'
          const { createHash } = require("node:crypto");
          const { readFileSync } = require("node:fs");
          const { join } = require("node:path");
          const [zip, version, market, repo, helperJson, dir] = process.argv.slice(2);
          const sha = (file) => createHash("sha256").update(readFileSync(file)).digest("hex");
          const entry = JSON.parse(readFileSync(market, "utf8")).plugins.find((p) => p.name === "findwright") ?? { source: {} };
          const pin = JSON.parse(readFileSync(helperJson, "utf8")).node;
          const problems = [];
          if (entry.version !== version) problems.push(`${repo} lists version ${entry.version}, the tag is ${version}`);
          if ((entry.source.sha256 ?? "").toLowerCase() !== sha(zip)) problems.push(`${repo} pins ${entry.source.sha256}, the rebuilt zip is ${sha(zip)}`);
          if (!(entry.source.url ?? "").endsWith(`/v${version}/findwright-${version}.zip`)) problems.push(`${repo}'s url does not name this release's zip`);
          if (sha(join(dir, pin.file)) !== pin.sha256) problems.push(`${pin.file} differs from the SHA-256 the plugin pins`);
          for (const p of problems) console.log(`::error::${p}`);
          if (problems.length) {
            console.log(`::error::set the findwright entry in ${repo} to this release's version, zip url and SHA-256, then run: gh workflow run release-plugin.yml -f tag=v${version}`);
            process.exit(1);
          }
          EOF
          echo "zip=$zip" >> "$GITHUB_OUTPUT"
          echo "dir=$dir" >> "$GITHUB_OUTPUT"

      - name: Attach the zip and the helper to the release
        env:
          GH_TOKEN: ${{ github.token }}
          ZIP: ${{ steps.build.outputs.zip }}
          DIR: ${{ steps.build.outputs.dir }}
        run: gh release upload "$TAG" "$ZIP" "$DIR"/*.tgz --clobber --repo "$GITHUB_REPOSITORY"

      # The plugin directory follows the `plugin` branch, whose root is the
      # packed plugin of the newest release: one commit per release, tagged
      # findwright--vX.Y.Z so a marketplace that sources this branch can
      # resolve a dependency's version range.
      - name: Publish the packed plugin to the plugin branch
        env:
          GH_TOKEN: ${{ github.token }}
          ZIP: ${{ steps.build.outputs.zip }}
        run: |
          set -euo pipefail
          zip_path="$GITHUB_WORKSPACE/$ZIP"
          dir="$RUNNER_TEMP/plugin-branch"
          url="https://github.com/$GITHUB_REPOSITORY"
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          echo "::add-mask::$auth"
          git init -q "$dir"
          cd "$dir"
          if git -c http.extraheader="$auth" ls-remote --exit-code -q "$url" refs/heads/plugin >/dev/null; then
            git -c http.extraheader="$auth" fetch -q --depth 1 "$url" plugin
            git checkout -q -b plugin FETCH_HEAD
            git rm -rq --ignore-unmatch .
          else
            git checkout -q --orphan plugin
          fi
          unzip -q "$zip_path" -d .
          git add -A
          if git diff --cached --quiet; then
            echo "::notice::The plugin branch already holds $TAG's plugin"
          else
            git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -q -m "chore(release): plugin $TAG"
            git -c http.extraheader="$auth" push -q "$url" plugin:plugin
            echo "::notice::The plugin branch now holds $TAG's plugin"
          fi
          tag="findwright--$TAG"
          if git -c http.extraheader="$auth" ls-remote --exit-code -q "$url" "refs/tags/$tag" >/dev/null; then
            echo "::notice::$tag already exists"
          else
            git tag "$tag" HEAD
            git -c http.extraheader="$auth" push -q "$url" "refs/tags/$tag"
            echo "::notice::Tagged the plugin branch $tag"
          fi
